
name: Deploy E-commerce Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ecommerce-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Next.js Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          command_timeout: 30m
          script: |
            set -eu

            APP_DIR="/var/www/shop/ecom-frontend"
            REPO_URL="https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPOSITORY.git"
            BRANCH="main"
            APP_NAME="ecom-frontend"
            APP_PORT="3015"

            echo "Starting Next.js frontend deployment..."

            # Ensure the parent directory exists
            mkdir -p "$(dirname "$APP_DIR")"

            # Clone the repository if it does not exist
            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -e "$APP_DIR" ]; then
                echo "ERROR: $APP_DIR exists but is not a Git repository."
                echo "Please inspect the directory before continuing."
                exit 1
              fi

              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Verify the expected repository
            git remote set-url origin "$REPO_URL"

            # Fetch and deploy the latest main branch
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            # Verify the Next.js project
            if [ ! -f package.json ]; then
              echo "ERROR: package.json not found in $APP_DIR"
              exit 1
            fi

            if ! node -e "const p=require('./package.json'); if (!p.scripts || !p.scripts.build || !p.scripts.start) process.exit(1)"; then
              echo "ERROR: package.json must define build and start scripts."
              exit 1
            fi

            # Ensure Node.js and npm are available
            node --version
            npm --version

            # Install dependencies and build Next.js
            npm ci
            npm run build

            # Create a production environment file if one is required.
            # Configure production variables separately if your app needs them.

            # Start or restart the application using PM2
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "ERROR: PM2 is not installed or not in PATH."
              echo "Install it with: npm install -g pm2"
              exit 1
            fi

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              PORT="$APP_PORT" NODE_ENV=production pm2 restart "$APP_NAME" --update-env
            else
              PORT="$APP_PORT" NODE_ENV=production pm2 start npm \
                --name "$APP_NAME" \
                -- start
            fi

            pm2 save

            # Verify the application responds locally
            echo "Waiting for Next.js to start..."
            sleep 5

            if ! curl --fail --silent --show-error \
              "http://127.0.0.1:$APP_PORT" \
              --output /dev/null; then
              echo "ERROR: Frontend did not respond on port $APP_PORT."
              pm2 logs "$APP_NAME" --lines 50 --nostream || true
              exit 1
            fi

            echo "Frontend deployed successfully on port $APP_PORT."
